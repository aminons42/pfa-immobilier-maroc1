<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMMO MAROC | Comparateur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
    <div class="font-bold text-xl text-indigo-600 flex items-center gap-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
      COMPARATEUR
    </div>
    <div class="flex gap-6 font-medium text-sm text-slate-500">
      <a class="hover:text-indigo-600 transition" href="index.html">Carte</a>
      <a class="hover:text-indigo-600 transition" href="estimator.html">Estimer</a>
      <a class="hover:text-indigo-600 transition" href="dashboard.html">Marché</a>
      <a class="text-indigo-600" href="compare.html">Comparer</a>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10 grid gap-8">
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-end">
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Ville A</label>
        <select id="cityA" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"></select>
      </div>
      <div class="flex items-center justify-center font-bold text-slate-300 pb-3">VS</div>
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Ville B</label>
        <select id="cityB" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"></select>
      </div>
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Filtre (Optionnel)</label>
        <select id="typeFilter" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Tous les biens</option>
          <option>Appartements</option>
          <option>Maisons</option>
          <option>Villas et Riads</option>
        </select>
      </div>
      <button id="compareBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition w-full md:w-auto">Comparer</button>
    </div>

    <div class="grid lg:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100" id="compareTable">
        <div class="text-center text-slate-400 py-10">Sélectionnez deux villes pour afficher le tableau</div>
      </div>
      <div class="grid gap-8">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100" id="trendCard">
          <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4">Tendances Comparées</h3>
          <div class="trend-summary" id="trendSummary">Sélectionnez deux villes pour voir les tendances.</div>
          <div class="trend-bars" id="trendBars"></div>
        </div>
        <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100" id="verdictCard">
          <div class="text-center text-indigo-300 py-4">Le verdict de l'IA s'affichera ici</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="js/compare.js"></script>
</body>
</html>
